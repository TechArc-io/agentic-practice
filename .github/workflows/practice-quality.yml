name: Practice quality

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: practice-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Practice quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Pull request contract
        if: github.event_name == 'pull_request' && github.event.pull_request.base.repo.fork
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: npm run check:pr-contract
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:verified
      - name: Assignment acceptance
        if: github.event_name == 'pull_request' && github.event.pull_request.base.repo.fork
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: npm run check:assignment
